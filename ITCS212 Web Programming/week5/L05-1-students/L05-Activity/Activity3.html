<html>
    <head>
        <style>
            .myFont{
                font-family: Arial, Helvetica, sans-serif;
                font-size: 50px;
                word-spacing: 2px;
                color: #1C497D;
                display: block;
            }
        </style>
    </head>
    <body>
        <div id = "name">
            <span id = "firstName"></span>
            <span id = "lastName"></span>
        </div>
        <script type="application/javascript">
            /* ----- Your JS code is here ----- */
    
            /* 1. Append a new <span> with id = "nickName"  */
            let nickname = document.createElement("span");
            nickname.id = "nickName";
            nickname.innerText = "boat";
            name_elem = document.getElementById("name")
            name_elem.append(nickname)

            /* 2. Insert your name for the content of each <span> */
            document.getElementById("firstName").textContent = "Phuriwat"
            document.getElementById("lastName").textContent = "Angkoondittaphong"



            /* 3. Apply all <span> with the class "myFont"  */
            spans = document.getElementsByTagName("span");
            for (let i = 0; i < spans.length; i++) {
                spans[i].classList.add("myFont");
            }

            /* ==========  Activity 3 ends here  ========== */
        </script>
    </body>
</html>
