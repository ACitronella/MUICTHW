<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
        let first_val = 22;
        let second_val = 3;
        console.log("First No: = " + first_val);
        console.log("Second No: = " + second_val);
        console.log("" + first_val + " + " + second_val + " = " + (first_val + second_val));
        console.log("" + first_val + " - " + second_val + " = " + (first_val - second_val));
        console.log("" + first_val + " * " + second_val + " = " + (first_val * second_val));
        console.log("" + first_val + " / " + second_val + " = " + (first_val / second_val));

    </script>
</body>
</html>
